<title>OBALUGO GIVEAWAY</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b0b12;color:#fff}
.container{max-width:760px;margin:auto;padding:24px 16px}
.hero{text-align:center;padding:35px 15px 25px}
.logo{font-size:38px;font-weight:900;letter-spacing:1px}
.sub{color:#bdbdcc;margin-top:8px}
.card{background:#151522;border:1px solid #29293a;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 10px 30px #0005}
.step{display:flex;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid #29293a}
.step:last-child{border-bottom:0}
.num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#242438;font-weight:bold}
.step h3{margin:0 0 5px;font-size:17px}
.step p{margin:0;color:#aaaabd;font-size:13px}

.visit{background:#fff;color:#111;margin-left:auto}
.check{background:#20c878;color:#06130c;width:100%;margin-top:14px;font-size:16px}
.disabled{opacity:.45;pointer-events:none}
#claim{display:none}
.account{background:#101018;border:1px solid #303044;border-radius:14px;padding:16px;margin-top:12px}
.account strong{display:block;font-size:18px}
