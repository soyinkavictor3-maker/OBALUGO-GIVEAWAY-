<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBALUGO GIVEAWAY - Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0b12;
  color:#fff;
}

.container{
  max-width:900px;
  margin:auto;
  padding:25px 16px;
}

h1{
  text-align:center;
  margin-bottom:25px;
}

.card{
  background:#151522;
  border:1px solid #29293a;
  border-radius:18px;
  padding:22px;
  margin:16px 0;
}

input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:10px;
  border:1px solid #333348;
  background:#0f0f18;
  color:#fff;
  font-size:15px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}

.login{
  background:#6c5ce7;
  color:#fff;
  width:100%;
}

.add{
  background:#20c878;
  color:#06130c;
}

.logout{
  background:#e74c3c;
  color:#fff;
}

.delete{
  background:#e74c3c;
  color:#fff;
  padding:8px 12px;
}

#dashboard{
  display:none;
}

.account{
  background:#101018;
  border:1px solid #303044;
  border-radius:12px;
  padding:15px;
  margin-top:10px;
}

.account strong{
  font-size:17px;
}

.account small{
  display:block;
  color:#aaa;
  margin-top:5px;
}

.status{
  margin-top:12px;
  color:#aaa;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  border-bottom:1px solid #29293a;
  padding:12px 8px;
  text-align:left;
}

th{
  color:#aaa;
}

.available{
  color:#20c878;
  font-weight:bold;
}

.claimed{
  color:#ff7675;
  font-weight:bold;
}

.notice{
  color:#aaa;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎁 OBALUGO GIVEAWAY ADMIN</h1>

<!-- LOGIN -->
<div id="loginCard" class="card">

<h2>Admin Login</h2>

<input
  id="username"
  type="text"
  placeholder="Admin username"
>

<input
  id="password"
  type="password"
  placeholder="Admin password"
>

<button class="login" onclick="login()">
🔐 Login
</button>

<p id="loginResult" class="notice"></p>

</div>


<!-- DASHBOARD -->
<div id="dashboard">

<div class="card">

<h2>📊 Giveaway Dashboard</h2>

<p>
Available accounts:
<strong id="availableCount">0</strong>
</p>

<button class="logout" onclick="logout()">
🚪 Logout
</button>

</div>


<div class="card">

<h2>➕ Add CPM Account</h2>

<p class="notice">
Add the CPM username/email and password that you are authorized to distribute.
</p>

<input
  id="accountUsername"
  type="text"
  placeholder="CPM username or email"
>

<input
  id="accountPassword"
  type="text"
  placeholder="CPM password"
>

<button class="add" onclick="addAccount()">
➕ Add Account
</button>

<p id="addResult" class="notice"></p>

</div>


<div class="card">

<h2>🎮 CPM Accounts</h2>

<div id="accounts">
Loading accounts...
</div>

</div>

</div>

</div>


<script>

async function checkLogin(){

  const response = await fetch("/api/admin/status");

  const data = await response.json();

  if(data.loggedIn){
    showDashboard();
  }

}


async function login(){

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  const result =
    document.getElementById("loginResult");

  result.textContent = "Logging in...";

  const response = await fetch(
    "/api/admin/login",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        username,
        password
      })
    }
  );

  const data = await response.json();

  if(response.ok){

    result.textContent = "";

    showDashboard();

  }else{

    result.textContent =
      data.error || "Login failed.";

  }

}


function showDashboard(){

  document.getElementById("loginCard").style.display =
    "none";

  document.getElementById("dashboard").style.display =
    "block";

  loadAccounts();

}


async function logout(){

  await fetch(
    "/api/admin/logout",
    {
      method:"POST"
    }
  );

  location.reload();

}


async function addAccount(){

  const username =
    document.getElementById("accountUsername").value.trim();

  const password =
    document.getElementById("accountPassword").value;

  const result =
    document.getElementById("addResult");

  if(!username || !password){

    result.textContent =
      "Please enter both username/email and password.";

    return;

  }

  result.textContent = "Adding account...";

  const response = await fetch(
    "/api/admin/accounts",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        username,
        password
      })
    }
  );

  const data = await response.json();

  if(response.ok){

    result.textContent =
      "✅ Account added successfully.";

    document.getElementById("accountUsername").value = "";
    document.getElementById("accountPassword").value = "";

    loadAccounts();

  }else{

    result.textContent =
      data.error || "Could not add account.";

  }

}


async function deleteAccount(id){

  if(!confirm(
    "Are you sure you want to delete this account?"
  )){
    return;
  }

  const response = await fetch(
    "/api/admin/accounts/" + id,
    {
      method:"DELETE"
    }
  );

  if(response.ok){

    loadAccounts();

  }else{

    alert("Could not delete account.");

  }

}


async function loadAccounts(){

  const response = await fetch(
    "/api/admin/accounts"
  );

  if(response.status === 401){

    location.reload();

    return;

  }

  const accounts = await response.json();

  const container =
    document.getElementById("accounts");

  const available =
    accounts.filter(a => !a.claimed).length;

  document.getElementById("availableCount")
    .textContent = available;

  if(accounts.length === 0){

    container.innerHTML =
      "<p class='notice'>No CPM accounts have been added yet.</p>";

    return;

  }

  let html = "";

  accounts.forEach(account => {

    html += `
      <div class="account">

        <strong>
          ${escapeHtml(account.username)}
        </strong>

        <small>
          Status:
          ${
            account.claimed
              ? '<span class="claimed">CLAIMED</span>'
              : '<span class="available">AVAILABLE</span>'
          }
        </small>

        ${
          account.claimed_at
            ? `<small>Claimed: ${escapeHtml(account.claimed_at)}</small>`
            : ""
        }

        <button
          class="delete"
          onclick="deleteAccount(${account.id})"
        >
          🗑️ Delete
        </button>

      </div>
    `;

  });

  container.innerHTML = html;

}


function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


checkLogin();

</script>

</body>
</html>
